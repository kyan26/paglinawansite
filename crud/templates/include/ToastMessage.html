{% load static %}

{% if messages %}
<div class="fixed top-5 right-5 z-50 flex flex-col gap-2.5" id="toast-container">
    {% for message in messages %}
    <div id="toast-{{ forloop.counter }}"
         class="toast flex items-center gap-3 bg-white dark:bg-zinc-900 border border-black/10 dark:border-white/10 rounded-xl px-3.5 py-3 w-[300px] overflow-hidden shadow-sm"
         role="alert">

        {% if message.tags == 'error' %}
        <div class="shrink-0 w-8 h-8 rounded-lg bg-red-50 dark:bg-red-950 flex items-center justify-center">
            <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>
        {% elif message.tags == 'warning' %}
        <div class="shrink-0 w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-950 flex items-center justify-center">
            <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>
        {% else %}
        <div class="shrink-0 w-8 h-8 rounded-lg bg-green-50 dark:bg-green-950 flex items-center justify-center">
            <svg class="w-4 h-4 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        {% endif %}

        <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-zinc-900 dark:text-zinc-100 leading-tight">{{ message }}</p>
        </div>

        <button type="button"
                onclick="dismissToast('toast-{{ forloop.counter }}')"
                class="shrink-0 flex items-center justify-center w-7 h-7 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors"
                aria-label="Dismiss">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>

        <!-- progress bar -->
        <div class="toast-bar absolute bottom-0 left-0 h-0.5
            {% if message.tags == 'error' %}bg-red-400{% elif message.tags == 'warning' %}bg-amber-400{% else %}bg-green-400{% endif %}">
        </div>
    </div>
    {% endfor %}
</div>

<script>
    function dismissToast(id) {
        const el = document.getElementById(id);
        if (!el || el.classList.contains('toast-hiding')) return;
        el.classList.add('toast-hiding');
        el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    document.querySelectorAll('[id^="toast-"]').forEach((el, i) => {
        setTimeout(() => dismissToast(el.id), 3000 + i * 200);
    });
</script>
{% endif %}

<style>
@keyframes toast-in {
    from { transform: translateX(110%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
}
@keyframes toast-out {
    from { transform: translateX(0);    opacity: 1; }
    to   { transform: translateX(110%); opacity: 0; }
}
@keyframes toast-bar-shrink {
    from { width: 100%; }
    to   { width: 0%; }
}

.toast {
    position: relative;
    animation: toast-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.toast-hiding {
    animation: toast-out 0.3s cubic-bezier(0.4, 0, 1, 1) forwards !important;
}
.toast-bar {
    animation: toast-bar-shrink 3s linear 0.45s forwards;
}
</style>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static '/css/output.css' %}">
    <title>{% block 'title' %}{% endblock 'title' %}</title>
    <style>
        body { background-color: #0f172a; }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 1000px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        #pageContent { display: none; }
    </style>
</head>
<body class="bg-[#0f172a]">

    <!-- SKELETON SCREEN -->
    <div id="skeletonScreen">

        <!-- Skeleton Navbar -->
        <div class="fixed top-0 left-0 right-0 z-50 h-14 bg-[#1e293b] border-b border-[#334155] flex items-center px-6 gap-4">
            <div class="skeleton h-5 w-8 rounded"></div>
            <div class="skeleton h-6 w-28"></div>
            <div class="ml-auto skeleton h-9 w-9 rounded-full"></div>
        </div>

        <!-- Skeleton Sidebar -->
        <div class="fixed top-14 left-0 h-full w-64 bg-[#0f172a] border-r border-[#334155] p-4 flex flex-col gap-6 pt-8">
            <div class="skeleton h-4 w-3/4"></div>
            <div class="skeleton h-4 w-1/2"></div>
            <div class="skeleton h-4 w-2/3"></div>
            <div class="skeleton h-4 w-3/4"></div>
            <div class="skeleton h-4 w-1/2"></div>
        </div>

        <!-- Skeleton Content -->
        <div class="sm:ml-64 mt-14 p-6" id="skeletonContent">

            <!-- TABLE pages skeleton (user list, gender list) -->
            <div id="sk-table" class="hidden flex flex-col gap-4">
                <div class="skeleton h-9 w-1/3 rounded-lg"></div>
                <div class="rounded-lg overflow-hidden border border-[#334155]">
                    <div class="bg-[#6366f1] px-6 py-3 flex gap-6">
                        {% for i in "123456" %}
                        <div class="skeleton h-4 w-1/6 opacity-30"></div>
                        {% endfor %}
                    </div>
                    {% for i in "1234567890" %}
                    <div class="flex gap-6 px-6 py-4 border-b border-[#334155] items-center bg-[#1e293b]">
                        <div class="skeleton h-9 w-9 rounded-full flex-shrink-0"></div>
                        <div class="skeleton h-4 w-1/6"></div>
                        <div class="skeleton h-4 w-1/6"></div>
                        <div class="skeleton h-4 w-1/6"></div>
                        <div class="skeleton h-4 w-1/6"></div>
                        <div class="flex gap-2 ml-auto">
                            <div class="skeleton h-8 w-14 rounded"></div>
                            <div class="skeleton h-8 w-14 rounded"></div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                <div class="flex justify-between items-center px-1">
                    <div class="skeleton h-4 w-40"></div>
                    <div class="flex gap-2">
                        <div class="skeleton h-8 w-8 rounded"></div>
                        <div class="skeleton h-8 w-8 rounded"></div>
                        <div class="skeleton h-8 w-8 rounded"></div>
                    </div>
                </div>
            </div>

            <!-- ADD USER skeleton -->
            <div id="sk-add-user" class="hidden">
                <div class="bg-[#1e293b] border border-[#334155] rounded-xl p-6 max-w-4xl">
                    <div class="skeleton h-7 w-36 mb-2"></div>
                    <div class="skeleton h-4 w-52 mb-6"></div>
                    <div class="skeleton h-24 w-24 rounded-full mb-6"></div>
                    <div class="grid grid-cols-2 gap-4">
                        {% for i in "12345678" %}
                        <div>
                            <div class="skeleton h-4 w-24 mb-2"></div>
                            <div class="skeleton h-10 w-full rounded-lg"></div>
                        </div>
                        {% endfor %}
                    </div>
                    <div class="flex justify-end gap-2 mt-6">
                        <div class="skeleton h-10 w-20 rounded-lg"></div>
                        <div class="skeleton h-10 w-24 rounded-lg"></div>
                    </div>
                </div>
            </div>

            <!-- EDIT USER skeleton -->
            <div id="sk-edit-user" class="hidden">
                <div class="max-w-2xl mx-auto bg-[#1e293b] border border-[#334155] rounded-xl p-6">
                    <div class="skeleton h-6 w-32 mb-6"></div>
                    <div class="flex items-center gap-4 mb-6">
                        <div class="skeleton h-24 w-24 rounded-full"></div>
                        <div class="skeleton h-4 w-28"></div>
                    </div>
                    {% for i in "123456" %}
                    <div class="mb-4">
                        <div class="skeleton h-4 w-24 mb-2"></div>
                        <div class="skeleton h-10 w-full rounded-lg"></div>
                    </div>
                    {% endfor %}
                    <div class="flex gap-2 mt-4">
                        <div class="skeleton h-10 w-28 rounded-lg"></div>
                        <div class="skeleton h-10 w-20 rounded-lg"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- REAL CONTENT -->
    <div id="pageContent">
        {% block 'content' %}{% endblock 'content' %}
    </div>

    <script>
        const path = window.location.pathname;
        if (path.includes('/user/add')) {
            document.getElementById('sk-add-user').classList.remove('hidden');
        } else if (path.includes('/user/edit')) {
            document.getElementById('sk-edit-user').classList.remove('hidden');
        } else {
            document.getElementById('sk-table').classList.remove('hidden');
        }

        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('skeletonScreen').style.display = 'none';
                document.getElementById('pageContent').style.display = 'block';
            }, 1000);
        });
    </script>

</body>
</html>
